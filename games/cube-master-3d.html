<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cube Master 3D v2 | Ahmed Tools</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1c2740;--text:#f7f9ff;--muted:#9eabc8;--blue:#5c8dff;--cyan:#4de2e5;--green:#45e0a2;--red:#ff627d;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;touch-action:none}
button{font:inherit;border:0;cursor:pointer;color:var(--text)}
.app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column;padding:12px;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#618cff,#7a5cff);display:grid;place-items:center;font-size:23px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.stat{background:var(--panel);border:1px solid #ffffff0d;border-radius:13px;text-align:center;padding:8px 3px}
.stat small{display:block;color:var(--muted);font-size:10px}
.stat strong{font-size:15px}
.game-area{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:21px;border:1px solid #ffffff12;background:radial-gradient(ellipse at 50% 40%,#263a65,#131d35 48%,#0c1223)}
#game{width:100%;height:100%;display:block}
.message{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-size:13px;color:#d6e3ff;text-shadow:0 2px 4px #000;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#070b17c9;backdrop-filter:blur(8px);z-index:5}
.overlay.hidden{display:none}
.dialog{width:min(100%,330px);background:linear-gradient(145deg,#202d4b,#11192d);border:1px solid #ffffff20;border-radius:23px;padding:23px 18px;text-align:center}
.dialog h2{font-size:23px;margin:5px 0 9px}
.dialog p{color:#b5c4e5;font-size:13px;line-height:1.8}
.primary{width:100%;border-radius:14px;padding:13px;background:linear-gradient(110deg,#477dff,#7659f5);font-weight:800;font-size:15px;margin-top:10px}
.bottom-panel{background:var(--panel);border-radius:17px;padding:10px}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.slot{aspect-ratio:1;display:grid;place-items:center;background:#080e1c;border:1px solid #ffffff15;border-radius:9px;font-size:24px}
.slot.filled{background:linear-gradient(145deg,#34496d,#1b2942);border-color:#6d9dff77}
.slot.match{animation:pop .3s ease;background:#2e8d76 !important}
@keyframes pop{50%{transform:scale(1.2)}}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.control{padding:9px 2px;background:var(--panel2);border-radius:11px;font-size:11px}
.progress{height:4px;background:#ffffff12;border-radius:10px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .25s}
.combo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:var(--gold);text-shadow:0 0 20px #ffd166;pointer-events:none;opacity:0}
.combo.show{animation:comboPop 1s ease}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div style="display:flex;gap:9px;align-items:center"><div class="logo">🧊</div><div><b>Cube Master 3D v2</b><div style="font-size:10px;color:var(--muted)">Ahmed Tools - محسنة</div></div></div><div><button onclick="toggleSound()" id="soundBtn" style="background:var(--panel2);padding:9px;border-radius:12px">🔊</button></div></div>

<div class="stats">
<div class="stat"><small>المرحلة</small><strong id="levelValue">1</strong></div>
<div class="stat"><small>النقاط</small><strong id="scoreValue">0</strong></div>
<div class="stat"><small>أعلى نتيجة</small><strong id="bestValue">0</strong></div>
<div class="stat"><small>الوقت</small><strong id="timeValue">150</strong></div>
<div class="stat"><small>المتبقي</small><strong id="remainingValue">0</strong></div>
</div>

<div class="game-area">
<canvas id="game"></canvas>
<div id="comboText" class="combo">COMBO x2 🔥</div>
<div class="message" id="message">المس مكعبًا مكشوفًا لبدء المطابقة</div>
<div class="overlay" id="overlay"><div class="dialog"><div style="font-size:54px" id="dialogIcon">🧊</div><h2 id="dialogTitle">Cube Master 3D</h2><p id="dialogText">طابق 3 رموز، اعمل كومبو، ولا تملا الخانات السبع!</p><button class="primary" id="startBtn">ابدأ اللعب</button></div></div>
</div>

<div class="bottom-panel">
<div style="display:flex;justify-content:space-between;font-size:12px"><span>📦 خانات المطابقة</span><small id="slotCount">0 / 7</small></div>
<div class="slots" id="slots"></div>
<div class="progress"><div id="timeBar"></div></div>
<div class="controls">
<button class="control" id="hintBtn">💡<br>تلميح</button>
<button class="control" id="shuffleBtn">🔀<br>خلط</button>
<button class="control" id="undoBtn">↩️<br>تراجع</button>
<button class="control" id="pauseBtn">⏸️<br>إيقاف</button>
</div>
</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const $=id=>document.getElementById(id);
const canvas=$("game"), area=canvas.parentElement;
const icons=["🍓","🍋","🍇","🍉","🍒","🍍","🥝","🍑","🍊","🥥","🍎","🍐","🍌","🫐","🥕","🍄","🌸","⭐","🌙","💎","❤️","⚡","🔥","🌈","🎈","🐸","🐼","🦊","🐳","🦋","🌻","🍀","🎯","🎲","🎁","🚀","🪐","☀️","🌵","🐙","🐝","🦄","🍪","🍩","🧁","🍭","🎵","🎨","🏆"];
let tiles=[],slots=[],level=1,score=0,best=localStorage.getItem('cube_best')||0,combo=0,timeLeft=150,playing=false,paused=false,soundOn=true,timer=null,lastComboTime=0,drag=null;
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x111a30);
let camera=new THREE.PerspectiveCamera(42,1,.1,100);
let renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.HemisphereLight(0xdde8ff,0x27314b,2.1));
let key=new THREE.DirectionalLight(0xffffff,3); key.position.set(5,10,7); scene.add(key);
let cubeGroup=new THREE.Group(); scene.add(cubeGroup);
let raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();

function beep(f=550,d=.07){ if(!soundOn)return; try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){} }
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeTex(s){let c=document.createElement("canvas");c.width=c.height=256;let x=c.getContext("2d");let g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,"#f4f7ff");g.addColorStop(1,"#b7c8ec");x.fillStyle=g;x.fillRect(0,0,256,256);x.strokeStyle="#7792c4";x.lineWidth=9;x.strokeRect(7,7,242,242);x.fillStyle="#202b46";x.font="112px system-ui";x.textAlign="center";x.textBaseline="middle";x.fillText(s,128,132);let t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

function buildLevel(){
cubeGroup.clear(); tiles=[]; slots=[]; renderSlots();
let size=level>=5?7:level>=3?6:5;
let total=size*size*3; // كل رمز يتكرر 3 مرات
let baseIcons=shuffle([...icons]).slice(0,total/3);
let allSymbols=[]; baseIcons.forEach(s=>{allSymbols.push(s,s,s)}); shuffle(allSymbols);
let spacing=1.02, offset=(size-1)*spacing/2, idx=0;
for(let r=0;r<size;r++) for(let c=0;c<size;c++) for(let l=0;l<3;l++){
let sym=allSymbols[idx++];
let g=new THREE.Group(); g.position.set(c*spacing-offset+(l==1?.14:l==2?-.12:0), -.65+l*.36, r*spacing-offset+(l==1?-.12:l==2?.14:0));
g.userData={tile:true,symbol:sym,layer:l,active:true,baseY:g.position.y};
let body=new THREE.Mesh(new THREE.BoxGeometry(.94,.38,.94), new THREE.MeshStandardMaterial({color:0x6685bd,roughness:.36}));
let top=new THREE.Mesh(new THREE.PlaneGeometry(.84,.84), new THREE.MeshStandardMaterial({map:makeTex(sym)})); top.rotation.x=-Math.PI/2; top.position.y=.194;
g.add(body,top); g.userData.body=body; cubeGroup.add(g); tiles.push(g);
}
cubeGroup.rotation.set(-.32,.55,0);
let span=size*1.02+1; camera.position.set(span*.78,span*.92,span*1.08); camera.lookAt(0,.1,0);
updateStats();
}
function isFree(t){ if(!t.userData.active) return false; return !tiles.some(o=>o!==t&&o.userData.active&&o.userData.layer>t.userData.layer&&Math.abs(o.position.x-t.position.x)<.92&&Math.abs(o.position.z-t.position.z)<.92) }
function renderSlots(m=[]){ $("slots").innerHTML=""; for(let i=0;i<7;i++){let d=document.createElement("div"); d.className="slot"+(slots[i]?" filled":""); if(m.includes(i)) d.classList.add("match"); d.textContent=slots[i]?.symbol||""; $("slots").appendChild(d)} $("slotCount").textContent=slots.length+" / 7" }
function updateStats(){ $("levelValue").textContent=level; $("scoreValue").textContent=score; $("bestValue").textContent=best; $("timeValue").textContent=Math.max(0,timeLeft); $("remainingValue").textContent=tiles.filter(t=>t.userData.active).length; $("timeBar").style.width=Math.max(0,timeLeft/(150+(level-1)*15)*100)+"%" }
function msg(t){ $("message").textContent=t }
function showCombo(){ let el=$("comboText"); el.textContent=`COMBO x${combo} 🔥`; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show") }

function pickTile(tile){
if(!playing||paused||!isFree(tile)||slots.length>=7) return;
tile.userData.active=false; tile.visible=false;
slots.push({symbol:tile.userData.symbol,tile}); score+=5; beep(430,.045);
let sym=tile.userData.symbol, cnt=slots.filter(s=>s.symbol===sym).length;
if(cnt>=3){
let indexes=[]; for(let i=slots.length-1;i>=0&&indexes.length<3;i--) if(slots[i].symbol===sym) indexes.push(i);
slots=slots.filter((_,i)=>!indexes.includes(i));
let now=Date.now(); combo=(now-lastComboTime<3000)?combo+1:1; lastComboTime=now;
let gain=100*combo; score+=gain; if(combo>=2) showCombo();
beep(760,.12); msg(`✨ مطابقة! +${gain} ${combo>1?`كومبو x${combo}`:''}`);
renderSlots(indexes);
}else{ renderSlots(); msg("اجمع 3 رموز متشابهة") }
if(score>best){ best=score; localStorage.setItem('cube_best',best) }
updateStats();
if(tiles.every(t=>!t.userData.active)){ playing=false; clearInterval(timer); score+=level*100; updateStats(); $("dialogIcon").textContent="🏆"; $("dialogTitle").textContent="أحسنت!"; $("dialogText").textContent=`خلصت المرحلة ${level} +${level*100}`; $("overlay").classList.remove("hidden"); $("startBtn").textContent="المرحلة التالية"; $("startBtn").onclick=()=>{level++; startGame()} }
else if(slots.length>=7){ playing=false; clearInterval(timer); $("dialogIcon").textContent="💔"; $("dialogTitle").textContent="انتهت اللعبة"; $("dialogText").textContent="الخانات اتملت!"; $("overlay").classList.remove("hidden"); $("startBtn").textContent="إعادة المحاولة"; $("startBtn").onclick=()=>{level=1;score=0;combo=0;startGame()} }
}
function startGame(){ clearInterval(timer); playing=true; paused=false; timeLeft=150+(level-1)*15; combo=0; buildLevel(); $("overlay").classList.add("hidden"); msg("اختر المكعبات المكشوفة"); timer=setInterval(()=>{ if(!playing||paused) return; timeLeft--; updateStats(); if(timeLeft<=0){ playing=false; clearInterval(timer); $("dialogIcon").textContent="⏰"; $("dialogTitle").textContent="انتهى الوقت"; $("dialogText").textContent="حاول تاني"; $("overlay").classList.remove("hidden"); $("startBtn").onclick=()=>{level=1;score=0;startGame()} } },1000) }
function hit(e){ let r=renderer.domElement.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; raycaster.setFromCamera(pointer,camera); let hits=raycaster.intersectObjects(tiles.filter(t=>t.visible&&t.userData.active),true); for(let h of hits){ let o=h.object; while(o){ if(o.userData.tile) return o; o=o.parent } } return null }
canvas.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,id:e.pointerId}; canvas.setPointerCapture(e.pointerId) });
canvas.addEventListener("pointermove",e=>{ if(!drag||drag.id!==e.pointerId) return; let dx=e.clientX-drag.lx, dy=e.clientY-drag.ly; if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>7) drag.moved=true; if(drag.moved){ cubeGroup.rotation.y+=dx*.009; cubeGroup.rotation.x+=dy*.009 } drag.lx=e.clientX; drag.ly=e.clientY });
canvas.addEventListener("pointerup",e=>{ if(!drag) return; let m=drag.moved; drag=null; if(!m){ let t=hit(e); if(t) pickTile(t) } });
$("startBtn").onclick=()=>startGame();
$("hintBtn").onclick=()=>{ if(!playing) return; let free=tiles.filter(isFree); let map={}; free.forEach(t=>{(map[t.userData.symbol]=map[t.userData.symbol]||[]).push(t)}); let bestGroup=Object.values(map).find(g=>g.length>=3)||Object.values(map)[0]; if(bestGroup){ bestGroup.slice(0,3).forEach(t=>{ t.userData.body.material.emissive=new THREE.Color(0x39ffb2); t.userData.body.material.emissiveIntensity=.7; setTimeout(()=>{ t.userData.body.material.emissiveIntensity=0 },1200) }); msg("💡 دي 3 مكعبات شبه بعض!") } };
$("shuffleBtn").onclick=()=>{ if(!playing) return; let active=tiles.filter(t=>t.userData.active); let syms=shuffle(active.map(t=>t.userData.symbol)); active.forEach((t,i)=>{ t.userData.symbol=syms[i]; t.children[1].material.map=makeTex(syms[i]); t.children[1].material.needsUpdate=true }); msg("🔀 تم خلط الرموز"); beep(600,.08) };
$("undoBtn").onclick=()=>{ if(!playing||!slots.length) return; let last=slots.pop(); last.tile.userData.active=true; last.tile.visible=true; score=Math.max(0,score-5); renderSlots(); updateStats(); msg("تراجعت") };
$("pauseBtn").onclick=()=>{ if(!playing) return; paused=!paused; $("pauseBtn").innerHTML=paused?"▶️<br>متابعة":"⏸️<br>إيقاف"; msg(paused?"متوقفة":"كمل!") };
window.toggleSound=()=>{ soundOn=!soundOn; $("soundBtn").textContent=soundOn?"🔊":"🔇" };
function resize(){ let w=area.clientWidth,h=area.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix() } window.addEventListener("resize",resize); resize();
function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera) } animate(); buildLevel();
</script>
</body>
</html>

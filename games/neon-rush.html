<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09091b">
<title>الاندفاع النيونّي | Ahmed Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09091b;color:#f4f5ff;font-family:system-ui,Arial;padding:12px}.wrap{max-width:520px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back,button{border:1px solid #38365f;background:#1b1a36;color:#f4f5ff;padding:10px 13px;border-radius:12px;font:inherit;text-decoration:none}h1{font-size:24px;margin:13px 0 3px}.muted{color:#a9a8d1;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat{background:#17162d;border:1px solid #343052;border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:21px;color:#ff69ee}.arena{height:390px;position:relative;overflow:hidden;border-radius:18px;border:1px solid #51408b;background:radial-gradient(ellipse at top,#22204b,#080817 70%);touch-action:manipulation}.lane{position:absolute;top:0;bottom:0;width:33.333%;border-left:1px dashed #39345e}.lane:nth-child(1){left:0}.lane:nth-child(2){left:33.333%}.lane:nth-child(3){left:66.666%}.player,.obstacle,.coin{position:absolute;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:12px}.player{bottom:18px;background:#52f7ff;box-shadow:0 0 18px #52f7ff;z-index:2}.obstacle{background:#ff386b;box-shadow:0 0 14px #ff386b;border-radius:8px}.coin{width:25px;height:25px;border-radius:50%;background:#ffdd57;box-shadow:0 0 14px #ffdd57}.overlay{position:absolute;inset:0;background:#070715d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}.overlay h2{margin:0 0 8px}.overlay button{background:#6c39de;border-color:#9a75ff;margin-top:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.controls button{font-size:22px;padding:14px}.note{text-align:center;color:#a9a8d1;font-size:12px;margin:10px}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← الألعاب</a><span class="muted">AHMED TOOLS</span></div><h1>⚡ الاندفاع النيونّي</h1><div class="muted">انتقل بين المسارات لتفادي الحواجز واجمع العملات الذهبية.</div><div class="stats"><div class="stat">النقاط<b id="score">0</b></div><div class="stat">العملات<b id="coins">0</b></div><div class="stat">أفضل نتيجة<b id="best">0</b></div></div><div class="arena" id="arena"><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="player" id="player"></div><div class="overlay" id="overlay"><h2>جاهز للاندفاع؟</h2><div class="muted">تفادى الحواجز لأطول مدة ممكنة.</div><button id="start">ابدأ اللعب</button></div></div><div class="controls"><button id="left">⬅️ المسار الأيسر</button><button id="right">المسار الأيمن ➡️</button></div><div class="note">يمكنك أيضًا لمس المسار المطلوب داخل ساحة اللعب.</div></div>
<script>
const $=id=>document.getElementById(id);let lane=1,score=0,coins=0,best=Number(localStorage.getItem("neonRushBest")||0),running=false,items=[],last=0,spawn=0,speed=2.3,raf=0;
$("best").textContent=best;
function placePlayer(){$("player").style.left=((lane*100/3)+(100/6))+"%"}
function start(){cancelAnimationFrame(raf);items.forEach(i=>i.el.remove());items=[];lane=1;score=0;coins=0;speed=2.3;spawn=0;last=0;running=true;$("score").textContent=0;$("coins").textContent=0;$("overlay").style.display="none";placePlayer();raf=requestAnimationFrame(loop)}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));placePlayer()}
function createItem(){let isCoin=Math.random()<.32,ln=Math.floor(Math.random()*3),el=document.createElement("div");el.className=isCoin?"coin":"obstacle";el.style.left=((ln*100/3)+(100/6))+"%";el.style.top="-45px";$("arena").appendChild(el);items.push({el,lane:ln,y:-45,coin:isCoin,hit:false})}
function end(){running=false;$("overlay").style.display="flex";let title=$("overlay").querySelector("h2");title.textContent="انتهت الجولة!";$("overlay").querySelector(".muted").textContent="نتيجتك "+score+" نقطة، وجمعت "+coins+" عملة."; $("start").textContent="العب مرة أخرى";if(score>best){best=score;localStorage.setItem("neonRushBest",best);$("best").textContent=best}}
function loop(t){if(!running)return;let dt=Math.min(34,t-(last||t));last=t;spawn+=dt;if(spawn>Math.max(300,800-score*2)){spawn=0;createItem()}speed=2.3+score/180;items.forEach(it=>{it.y+=speed*dt/16;it.el.style.top=it.y+"px";if(it.y>305&&it.y<370&&it.lane===lane&&!it.hit){it.hit=true;if(it.coin){coins++;$("coins").textContent=coins;score+=5;it.el.remove()}else{end()}}if(it.y>410)it.el.remove()});items=items.filter(i=>i.y<=410);score+=Math.floor(dt/80);$("score").textContent=score;raf=requestAnimationFrame(loop)}
$("start").onclick=start;$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("arena").addEventListener("pointerdown",e=>{if(!running)return;let r=$("arena").getBoundingClientRect(),x=e.clientX-r.left;lane=Math.max(0,Math.min(2,Math.floor(x/(r.width/3))));placePlayer()});document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")move(-1);if(e.key==="ArrowRight"||e.key==="d")move(1);if(e.key===" "&&!running)start()});placePlayer();
</script></body></html>

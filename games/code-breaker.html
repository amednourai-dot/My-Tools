<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>Code Breaker</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eaf0ff;font-family:system-ui;padding:16px;display:grid;place-items:center}.app{width:min(100%,500px)}header{text-align:center}.panel{background:#141c31;border:1px solid #283651;border-radius:18px;padding:16px;margin:12px 0}.digits{display:flex;gap:8px;justify-content:center;margin:16px}.digit{width:55px;height:60px;display:grid;place-items:center;border-radius:12px;background:#0b1020;border:1px solid #354663;font-size:28px;color:#7dd3fc}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.key,.btn{border:0;border-radius:10px;background:#273651;color:white;padding:13px 0;font-size:16px;font-weight:bold}.actions{display:flex;gap:8px;margin-top:10px}.btn{flex:1;background:#2563eb}.alt{background:#334155}.history{max-height:180px;overflow:auto}.entry{display:flex;justify-content:space-between;background:#0b1020;padding:9px;border-radius:8px;margin-top:7px}.status{text-align:center;min-height:24px;margin-top:10px}.hint{font-size:12px;color:#9baaca;text-align:center}</style><main class="app"><header><div style="font-size:40px">🔐</div><h1>Code Breaker</h1><p>اكتشف الشفرة المكوّنة من 4 أرقام مختلفة</p></header><section class="panel"><div style="display:flex;justify-content:space-around">المحاولات المتبقية: <b id="left">10</b> <span>أفضل نتيجة: <b id="best">—</b></span></div><div class="digits" id="digits"></div><div class="keys" id="keys"></div><div class="actions"><button class="btn" id="submit">تحقق</button><button class="btn alt" id="clear">مسح</button></div><p class="hint">🟢 رقم ومكان صحيحان · 🟡 رقم صحيح بمكان خاطئ</p><div class="status" id="status"></div></section><section class="panel"><b>سجل المحاولات</b><div class="history" id="history"></div></section><button class="btn" style="width:100%;padding:13px" id="new">لعبة جديدة</button></main><script>const $=id=>document.getElementById(id);let secret=[],guess=[],tries=10,ended=false,best=+(localStorage.cbBest||0);$('best').textContent=best||'—';for(let n=0;n<10;n++){let b=document.createElement('button');b.className='key';b.textContent=n;b.onclick=()=>{if(!ended&&guess.length<4&&!guess.includes(n)){guess.push(n);draw()}};$('keys').appendChild(b)}function draw(){$('digits').innerHTML='';for(let i=0;i<4;i++){let d=document.createElement('div');d.className='digit';d.textContent=guess[i]??'_';$('digits').appendChild(d)}}function start(){secret=[];while(secret.length<4){let n=Math.floor(Math.random()*10);if(!secret.includes(n))secret.push(n)}guess=[];tries=10;ended=false;$('left').textContent=tries;$('history').innerHTML='';$('status').textContent='أدخل أربعة أرقام مختلفة';draw()}function submit(){if(ended)return;if(guess.length!==4){$('status').textContent='أدخل أربعة أرقام أولًا';return}let exact=guess.filter((n,i)=>n===secret[i]).length,near=guess.filter((n,i)=>secret.includes(n)&&n!==secret[i]).length;tries--;$('left').textContent=tries;let e=document.createElement('div');e.className='entry';let strong=document.createElement('strong');strong.textContent=guess.join('');let span=document.createElement('span');span.textContent=exact+' صحيح · '+near+' قريب';e.append(strong,span);$('history').prepend(e);if(exact===4){ended=true;$('status').textContent='نجحت! كسرت الشفرة في '+(11-tries)+' محاولات';if(!best||11-tries<best){best=11-tries;localStorage.cbBest=best;$('best').textContent=best}}else if(!tries){ended=true;$('status').textContent='انتهت المحاولات. الشفرة: '+secret.join('')}else $('status').textContent='تابع، بقيت '+tries+' محاولات';guess=[];draw()}$('submit').onclick=submit;$('clear').onclick=()=>{guess=[];draw()};$('new').onclick=start;start();</script></html>

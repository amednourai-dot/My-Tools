<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>كاسحة الألغام | Ahmed Tools</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding:16px;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif}main{max-width:520px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}h1{font-size:23px;margin:0 0 6px}p{color:#94a3b8;line-height:1.6;font-size:13px;margin:0}a,button,select{border:0;border-radius:12px;padding:10px 13px;color:white;background:#2563eb;text-decoration:none;font:inherit}.panel{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:13px;margin-bottom:14px}.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}select{background:#0f172a;border:1px solid #475569}.stats{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:13px}.stats strong{color:#93c5fd}.board-wrap{overflow:auto;padding:2px}.board{display:grid;gap:4px;justify-content:center;margin:auto;touch-action:manipulation}.cell{width:clamp(25px,7.3vw,38px);height:clamp(25px,7.3vw,38px);padding:0;border-radius:6px;background:#334155;border:1px solid #475569;color:#f8fafc;font-weight:bold;font-size:15px}.cell.open{background:#cbd5e1;color:#0f172a;border-color:#cbd5e1}.cell.flag{background:#1d4ed8}.cell.mine{background:#ef4444}.cell:disabled{opacity:1}.message{text-align:center;min-height:24px;color:#facc15;font-weight:bold;margin-top:12px}.help{font-size:12px;color:#94a3b8;line-height:1.8}
</style>
</head>
<body><main>
<header><div><h1>💣 كاسحة الألغام</h1><p>اكشف الخلايا الآمنة وتجنب الألغام.</p></div><a href="index.html">رجوع</a></header>
<section class="panel"><div class="controls"><label for="level">المستوى</label><select id="level"><option value="easy">سهل 9×9</option><option value="medium">متوسط 10×10</option><option value="hard">صعب 12×12</option></select><button id="restart">لعبة جديدة</button></div><div class="stats"><span>💣 الألغام: <strong id="mines">10</strong></span><span>🚩 الأعلام: <strong id="flags">0</strong></span><span>⏱️ الوقت: <strong id="time">0</strong></span></div></section>
<section class="panel"><div class="board-wrap"><div class="board" id="board"></div></div><div class="message" id="message">اضغط على خلية للبدء.</div></section>
<p class="help">على الهاتف: اضغط مطولًا على الخلية لوضع علم 🚩، أو فعّل وضع الأعلام بالزر أدناه.</p>
<section class="panel controls"><button id="flagMode">🚩 وضع الأعلام: متوقف</button><span class="help">افتح جميع الخلايا الآمنة للفوز.</span></section>
</main>
<script>
const boardEl=document.getElementById("board"),levelEl=document.getElementById("level"),messageEl=document.getElementById("message"),configs={easy:{rows:9,cols:9,mines:10},medium:{rows:10,cols:10,mines:18},hard:{rows:12,cols:12,mines:30}};
let cells=[],rows=9,cols=9,mineCount=10,started=false,ended=false,flagMode=false,seconds=0,timer=null,flags=0,opened=0;
function neighbors(i){const r=Math.floor(i/cols),c=i%cols,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols)out.push(nr*cols+nc)}return out}
function startTimer(){if(timer)return;timer=setInterval(()=>{seconds++;document.getElementById("time").textContent=seconds},1000)}
function newGame(){clearInterval(timer);timer=null;seconds=0;flags=0;opened=0;started=false;ended=false;flagMode=false;document.getElementById("time").textContent="0";document.getElementById("flags").textContent="0";document.getElementById("flagMode").textContent="🚩 وضع الأعلام: متوقف";const cfg=configs[levelEl.value];rows=cfg.rows;cols=cfg.cols;mineCount=cfg.mines;document.getElementById("mines").textContent=mineCount;messageEl.textContent="اضغط على خلية للبدء.";cells=Array.from({length:rows*cols},()=>({mine:false,open:false,flag:false,count:0}));boardEl.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;boardEl.innerHTML="";cells.forEach((cell,i)=>{const b=document.createElement("button");b.className="cell";b.type="button";b.setAttribute("aria-label",`خلية ${i+1}`);b.addEventListener("click",()=>{if(flagMode)toggleFlag(i);else openCell(i)});let press;b.addEventListener("touchstart",()=>{press=setTimeout(()=>toggleFlag(i),550)},{passive:true});b.addEventListener("touchend",()=>clearTimeout(press));b.addEventListener("contextmenu",e=>{e.preventDefault();toggleFlag(i)});cell.el=b;boardEl.appendChild(b)})}
function placeMines(first){const safe=new Set([first,...neighbors(first)]);let placed=0;while(placed<mineCount){const i=Math.floor(Math.random()*cells.length);if(cells[i].mine||safe.has(i))continue;cells[i].mine=true;placed++}cells.forEach((c,i)=>{if(!c.mine)c.count=neighbors(i).filter(n=>cells[n].mine).length})}
function toggleFlag(i){if(ended||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;cells[i].el.textContent=cells[i].flag?"🚩":"";cells[i].el.classList.toggle("flag",cells[i].flag);document.getElementById("flags").textContent=flags}
function openCell(i){if(ended||cells[i].open||cells[i].flag)return;if(!started){started=true;placeMines(i);startTimer()}const c=cells[i];c.open=true;opened++;c.el.classList.add("open");c.el.disabled=true;if(c.mine){c.el.textContent="💣";c.el.classList.add("mine");finish(false);return}if(c.count){c.el.textContent=c.count;c.el.style.color=["","#2563eb","#15803d","#dc2626","#7c3aed","#b45309","#0891b2","#111827","#475569"][c.count]}else neighbors(i).forEach(n=>{if(!cells[n].open&&!cells[n].mine)openCell(n)});if(opened===cells.length-mineCount)finish(true)}
function finish(win){ended=true;clearInterval(timer);timer=null;if(!win){cells.forEach(c=>{if(c.mine){c.el.textContent="💣";c.el.classList.add("mine")}c.el.disabled=true});messageEl.textContent="انتهت اللعبة! حاول مرة أخرى."}else messageEl.textContent=`🎉 فزت في ${seconds} ثانية!`}
document.getElementById("restart").addEventListener("click",newGame);levelEl.addEventListener("change",newGame);document.getElementById("flagMode").addEventListener("click",()=>{flagMode=!flagMode;document.getElementById("flagMode").textContent=`🚩 وضع الأعلام: ${flagMode?"مفعّل":"متوقف"}`});newGame();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06130f"><title>Hacker Simulator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06130f;color:#d7ffe8;font-family:ui-monospace,monospace;padding:16px;display:grid;place-items:center}.app{width:min(100%,560px)}header{text-align:center}h1{color:#4ade80}.screen{background:#020906;border:1px solid #14532d;border-radius:16px;padding:16px;box-shadow:0 0 25px #14532d35}.bar{display:flex;justify-content:space-between;color:#4ade80;font-size:12px;border-bottom:1px solid #164e2c;padding-bottom:10px}.terminal{height:150px;overflow:auto;padding:10px 0;line-height:1.7;font-size:13px}.line{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#fb7185}.challenge{background:#0b1b12;border:1px solid #14532d;padding:14px;border-radius:12px}.question{font-family:system-ui;line-height:1.7}.code{direction:ltr;text-align:center;font-size:22px;color:#4ade80;letter-spacing:4px;padding:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice,.btn{padding:12px;border-radius:10px;border:1px solid #166534;background:#102719;color:#d7ffe8;font-weight:bold}.btn{width:100%;margin-top:10px;background:#166534}.progress{height:6px;background:#173323;border-radius:8px;margin-top:12px;overflow:hidden}.progress div{height:100%;width:0;background:#4ade80}.footer{text-align:center;color:#659277;font:12px system-ui;margin-top:12px}</style><main class="app"><header><div style="font-size:40px">💻</div><h1>HACKER SIMULATOR</h1><p>محاكاة خيالية لحل الألغاز الرقمية والتعلم الآمن</p></header><section class="screen"><div class="bar"><span>AHMED_SECURE_TERMINAL</span><span id="mission">MISSION 01/05</span></div><div class="terminal" id="terminal"><div class="line ok">> تهيئة البيئة الافتراضية...</div><div class="line ok">> الاتصال محلي وآمن.</div><div class="line warn">> اختر الإجابة الصحيحة للمهمة الأولى.</div></div><div class="challenge"><div class="question" id="question"></div><div class="code" id="code"></div><div class="choices" id="choices"></div></div><div class="progress"><div id="progress"></div></div><button class="btn" id="restart">إعادة المحاكاة</button></section><div class="footer">تدريب تعليمي آمن — لا يتصل بأي جهاز أو خادم خارجي</div></main><script>const tasks=[{q:'شفرة ROT1 تحرّك كل حرف خطوة للأمام. ما النص الأصلي؟',code:'DBU',a:['CAT','BAT','CAR','CUT'],c:0,e:'إرجاع كل حرف خطوة يعطي CAT.'},{q:'أي رمز PIN من أربعة أرقام أصعب تخمينًا؟',code:'4-DIGIT PIN',a:['1234','0000','7392','1111'],c:2,e:'الرمز غير المتسلسل أقل وضوحًا من الأنماط الشائعة.'},{q:'ما أفضل خطوة لحماية حسابك؟',code:'ACCOUNT SECURITY',a:['تكرار كلمة المرور','تفعيل المصادقة الثنائية','مشاركة الرمز','تعطيل التحديثات'],c:1,e:'المصادقة الثنائية تضيف طبقة حماية.'},{q:'حوّل 1010 من الثنائي إلى العشري.',code:'1010₂ = ?₁₀',a:['8','10','12','14'],c:1,e:'1010₂ يساوي 10 بالنظام العشري.'},{q:'رسالة تطلب كلمة مرورك عبر رابط غريب. ماذا تفعل؟',code:'PHISHING CHECK',a:['فتح الرابط','إرسال كلمة المرور','التحقق من المصدر الرسمي','إعادة توجيهها'],c:2,e:'تحقق من المصدر الرسمي ولا تدخل بياناتك في رابط مشبوه.'}];let index=0,score=0,done=false;const $=id=>document.getElementById(id);function log(t,cls='ok'){let d=document.createElement('div');d.className='line '+cls;d.textContent='> '+t;$('terminal').appendChild(d);$('terminal').scrollTop=$('terminal').scrollHeight}function render(){if(index>=tasks.length){done=true;$('question').textContent='اكتملت المحاكاة! نتيجتك '+score+' من '+tasks.length;$('code').textContent='MISSION COMPLETE';$('choices').innerHTML='';$('mission').textContent='COMPLETE';$('progress').style.width='100%';log('انتهت المهام. النتيجة '+score+'/'+tasks.length);localStorage.hsBest=Math.max(score,+(localStorage.hsBest||0));return}let t=tasks[index];$('mission').textContent='MISSION '+String(index+1).padStart(2,'0')+'/'+tasks.length;$('question').textContent=t.q;$('code').textContent=t.code;$('progress').style.width=index/tasks.length*100+'%';$('choices').innerHTML='';t.a.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(i);$('choices').appendChild(b)})}function answer(i){if(done)return;let t=tasks[index];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(i===t.c){score++;log('تم قبول الإجابة: '+t.a[i])}else log('إجابة غير صحيحة. الصحيح: '+t.a[t.c],'err');log(t.e,'warn');index++;setTimeout(render,650)}$('restart').onclick=()=>{index=0;score=0;done=false;$('terminal').innerHTML='';log('تهيئة البيئة الافتراضية...');log('الاتصال محلي وآمن.');render()};render();</script></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071827">
<title>الهروب من الجليد | Ahmed Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071827;color:#effaff;font-family:system-ui,Arial;padding:14px}.wrap{max-width:540px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back,button{border:1px solid #31536a;background:#102b40;color:#effaff;padding:10px 13px;border-radius:12px;font:inherit;text-decoration:none}h1{font-size:24px;margin:14px 0 4px}.muted{color:#9eb9c9;font-size:14px}.panel{background:#0d2335;border:1px solid #244459;border-radius:18px;padding:14px;margin:14px 0}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;color:#70e5ff;font-size:21px}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:auto;max-width:380px;touch-action:manipulation}.cell{aspect-ratio:1;border-radius:8px;background:#173a51;display:grid;place-items:center;font-size:20px;border:1px solid #224960}.wall{background:#07121e;border-color:#142b3c}.ice{background:#bdefff;color:#07516c}.player{background:#2c83d8;color:white}.exit{background:#38b77a;color:#042b1b}.trap{background:#55283a;color:#ff9caf}.key{background:#624b19;color:#ffe58b}.controls{display:grid;grid-template-columns:repeat(3,60px);gap:7px;justify-content:center;margin-top:15px}.controls button{font-size:22px;padding:12px}.controls .empty{visibility:hidden}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.primary{background:#087ca3}#message{text-align:center;min-height:24px;color:#8feaff;margin:10px 0}@media(max-width:370px){.cell{font-size:16px;gap:3px}.board{gap:3px}}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← الألعاب</a><span class="muted">AHMED TOOLS</span></div><h1>🧊 الهروب من الجليد</h1><div class="muted">تحرك فوق الجليد، اجمع المفتاح، ثم وصل إلى المخرج الأخضر. احذر الفخاخ!</div><div class="panel"><div class="stats"><div>المرحلة<b id="level">1</b></div><div>الحركات<b id="moves">0</b></div><div>النجوم<b id="stars">0</b></div></div></div><div class="panel"><div class="board" id="board"></div><div class="controls"><button class="empty"> </button><button data-dir="up">⬆️</button><button class="empty"> </button><button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button></div><div class="actions"><button id="restart">إعادة المرحلة</button><button id="next" class="primary">المرحلة التالية</button></div><div id="message">اجمع المفتاح 🔑 قبل الوصول إلى المخرج.</div></div></div>
<script>
const $=id=>document.getElementById(id);const layouts=[
["#######","#P..K.#","#.#.#.#","#...#E#","#.#...#","#.....#","#######"],
["#######","#P#...#","#.#.#K#","#...#.#","###.#E#","#.....#","#######"],
["#######","#P....#","##.##.#","#K....#","#.###.#","#....E#","#######"],
["#######","#P#...#","#...#K#","#.T...#","#.#.#E#","#.....#","#######"],
["#######","#P....#","#.###.#","#K..T.#","#.##..#","#....E#","#######"]];
let level=0,grid=[],px=1,py=1,key=false,moves=0,stars=0,won=false;
function load(){grid=layouts[level%layouts.length].map(r=>r.split(""));px=1;py=1;key=false;moves=0;won=false;$("level").textContent=level+1;$("moves").textContent=0;$("stars").textContent=stars;$("message").textContent="اجمع المفتاح 🔑 قبل الوصول إلى المخرج.";draw()}
function draw(){$("board").innerHTML="";grid.forEach((row,y)=>row.forEach((v,x)=>{let d=document.createElement("div");d.className="cell";if(v==="#")d.classList.add("wall");if(v===".")d.classList.add("ice");if(v==="T")d.classList.add("trap");if(v==="K")d.classList.add("key");if(v==="E")d.classList.add("exit");d.textContent=v==="#"?"":v==="P"?"🧍":v==="K"?"🔑":v==="E"?"🚪":v==="T"?"💥":"";if(x===px&&y===py){d.className="cell player";d.textContent="🧍"}$("board").appendChild(d)}))}
function move(dir){if(won)return;let dx=dir==="left"?-1:dir==="right"?1:0,dy=dir==="up"?-1:dir==="down"?1:0,nx=px+dx,ny=py+dy;if(!grid[ny]||grid[ny][nx]==="#"||!grid[ny][nx])return;let v=grid[ny][nx];if(v==="T"){px=1;py=1;moves++;$("message").textContent="وقعت في فخ! عدت إلى البداية.";draw();$("moves").textContent=moves;return}if(v==="K"){key=true;grid[ny][nx]=".";$("message").textContent="أخذت المفتاح! توجه إلى المخرج."}if(v==="E"){if(!key){$("message").textContent="المخرج مغلق. ابحث عن المفتاح أولًا.";return}won=true;stars+=Math.max(1,3-Math.floor(moves/12));$("stars").textContent=stars;$("message").textContent="نجحت في الهروب! ⭐";return}px=nx;py=ny;moves++;$("moves").textContent=moves;draw()}
document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener("keydown",e=>{let m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){e.preventDefault();move(m[e.key])}});$("restart").onclick=load;$("next").onclick=()=>{if(won){level++;load()}else $("message").textContent="أكمل المرحلة الحالية أولًا."};load();
</script></body></html>

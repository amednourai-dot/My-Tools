<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111024">
<title>قلب الجاذبية | Ahmed Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111024;color:#f6f3ff;font-family:system-ui,Arial;padding:13px}.wrap{max-width:540px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back,button{border:1px solid #413b70;background:#211e3d;color:#f6f3ff;padding:10px 13px;border-radius:12px;font:inherit;text-decoration:none}h1{font-size:24px;margin:14px 0 4px}.muted{color:#b0acd1;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat{background:#1d1a35;border:1px solid #39345c;border-radius:13px;padding:10px;text-align:center}.stat b{display:block;color:#d5a6ff;font-size:21px}.game{height:350px;position:relative;overflow:hidden;border-radius:18px;border:1px solid #52478c;background:linear-gradient(#201b48,#100f25);touch-action:manipulation}.floor,.ceiling{position:absolute;left:0;width:100%;height:17px;background:#a16bff;box-shadow:0 0 18px #a16bff}.floor{bottom:0}.ceiling{top:0}.player{position:absolute;left:48px;width:30px;height:30px;border-radius:9px;background:#5ef4ff;box-shadow:0 0 16px #5ef4ff}.spike{position:absolute;width:28px;height:30px;background:#ff4f82;clip-path:polygon(50% 0,100% 100%,0 100%)}.star{position:absolute;font-size:23px}.overlay{position:absolute;inset:0;background:#100e22df;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;z-index:5}.overlay button{margin-top:12px;background:#7044d5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{padding:14px;font-size:18px}.hint{text-align:center;margin-top:10px;font-size:12px;color:#b0acd1}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← الألعاب</a><span class="muted">AHMED TOOLS</span></div><h1>🌀 قلب الجاذبية</h1><div class="muted">اضغط لقلب الجاذبية بين الأرض والسقف، وتجاوز العقبات واجمع النجوم.</div><div class="stats"><div class="stat">النقاط<b id="score">0</b></div><div class="stat">النجوم<b id="stars">0</b></div><div class="stat">أفضل نتيجة<b id="best">0</b></div></div><div class="game" id="game"><div class="ceiling"></div><div class="floor"></div><div class="player" id="player"></div><div class="overlay" id="overlay"><h2>غيّر الجاذبية!</h2><div class="muted">اقفز من الأرض إلى السقف لتفادي الحواجز.</div><button id="start">ابدأ اللعب</button></div></div><div class="actions"><button id="flip">🌀 اقلب الجاذبية</button><button id="restart">إعادة اللعب</button></div><div class="hint">يمكنك الضغط على مساحة اللعبة أيضًا لقلب الجاذبية.</div></div>
<script>
const $=id=>document.getElementById(id);let running=false,up=false,score=0,stars=0,best=Number(localStorage.getItem("gravityFlipBest")||0),items=[],last=0,spawn=0,speed=3,raf=0,playerY=0;
$("best").textContent=best;
function drawPlayer(){$("player").style.top=playerY+"px"}
function start(){cancelAnimationFrame(raf);items.forEach(i=>i.el.remove());items=[];up=false;score=0;stars=0;spawn=0;last=0;speed=3;playerY=303;$("score").textContent=0;$("stars").textContent=0;$("overlay").style.display="none";running=true;drawPlayer();raf=requestAnimationFrame(loop)}
function flip(){if(!running)return;up=!up;playerY=up?17:303;drawPlayer()}
function spawnItem(){let star=Math.random()<.28,el=document.createElement("div");el.className=star?"star":"spike";el.textContent=star?"⭐":"";let top=star?(Math.random()<.5?55:260):(up?300:25);if(!star)top=up?300:25;el.style.top=top+"px";el.style.left="105%";$("game").appendChild(el);items.push({el,x:$("game").clientWidth+20,y:top,star,hit:false})}
function finish(){running=false;$("overlay").style.display="flex";$("overlay").querySelector("h2").textContent="انتهت اللعبة!";$("overlay").querySelector(".muted").textContent="جمعت "+stars+" نجمة وحققت "+score+" نقطة.";$("start").textContent="العب مرة أخرى";if(score>best){best=score;localStorage.setItem("gravityFlipBest",best);$("best").textContent=best}}
function loop(t){if(!running)return;let dt=Math.min(35,t-(last||t));last=t;spawn+=dt;if(spawn>Math.max(380,850-score*2)){spawn=0;spawnItem()}speed=3+score/120;items.forEach(it=>{it.x-=speed*dt/16;it.el.style.left=it.x+"px";if(!it.hit&&it.x<78&&it.x>25){if(it.star){it.hit=true;stars++;score+=10;$("stars").textContent=stars;it.el.remove()}else{let dangerous=up?it.y>220:it.y<120;if(dangerous){finish()}}}if(it.x<-40)it.el.remove()});items=items.filter(i=>i.x>-40);score+=Math.floor(dt/90);$("score").textContent=score;raf=requestAnimationFrame(loop)}
$("start").onclick=start;$("flip").onclick=flip;$("restart").onclick=start;$("game").addEventListener("pointerdown",e=>{if(running)flip()});document.addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();if(running)flip();else start()}});
</script></body></html>

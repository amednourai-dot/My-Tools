<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>Memory Master</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui;padding:16px;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,480px)}header{text-align:center}p{color:#9eabc8}.panel{background:#141c31;border:1px solid #263452;border-radius:18px;padding:16px;margin:12px 0}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;color:#7dd3fc;font-size:22px}.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.pad{height:110px;border:0;border-radius:18px;opacity:.72}.pad.lit{opacity:1;transform:scale(.97);box-shadow:0 0 24px currentColor}.c1{background:#fb7185;color:#fb7185}.c2{background:#34d399;color:#34d399}.c3{background:#60a5fa;color:#60a5fa}.c4{background:#fbbf24;color:#fbbf24}.actions{display:flex;gap:8px}.btn{flex:1;padding:13px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:bold}.secondary{background:#334155}.msg{text-align:center;min-height:24px}</style><main class="app"><header><div style="font-size:42px">🧠</div><h1>Memory Master</h1><p>احفظ تسلسل الألوان ثم أعده بالترتيب</p></header><section class="panel stats"><div>المستوى<b id="level">0</b></div><div>أفضل نتيجة<b id="best">0</b></div><div>الأخطاء<b id="errors">0</b></div></section><section class="panel"><div class="msg" id="msg">اضغط ابدأ لتشغيل اللعبة</div><div class="board"><button class="pad c1" data-i="0"></button><button class="pad c2" data-i="1"></button><button class="pad c3" data-i="2"></button><button class="pad c4" data-i="3"></button></div><div class="actions"><button class="btn" id="start">ابدأ اللعبة</button><button class="btn secondary" id="replay">عرض التسلسل</button></div></section></main><script>const pads=[...document.querySelectorAll('.pad')],$=id=>document.getElementById(id);let seq=[],step=0,level=0,errors=0,playing=false,showing=false,best=+(localStorage.mmBest||0);$('best').textContent=best;const wait=n=>new Promise(r=>setTimeout(r,n));async function flash(i){pads[i].classList.add('lit');await wait(350);pads[i].classList.remove('lit');await wait(150)}async function show(){if(showing||!playing)return;showing=true;$('msg').textContent='شاهد التسلسل...';await wait(300);for(let i of seq)await flash(i);showing=false;step=0;$('msg').textContent='دورك! أعد التسلسل'}function next(){level++;$('level').textContent=level;seq.push(Math.floor(Math.random()*4));show()}function start(){seq=[];step=0;level=0;errors=0;playing=true;$('level').textContent=0;$('errors').textContent=0;next()}pads.forEach(p=>p.onclick=()=>{if(!playing||showing)return;let i=+p.dataset.i;p.classList.add('lit');setTimeout(()=>p.classList.remove('lit'),130);if(i!==seq[step]){errors++;$('errors').textContent=errors;playing=false;$('msg').textContent='خطأ! اضغط ابدأ للمحاولة مجددًا';if(level>best){best=level;localStorage.mmBest=best;$('best').textContent=best}return}if(++step===seq.length){if(level>best){best=level;localStorage.mmBest=best;$('best').textContent=best}$('msg').textContent='أحسنت! المستوى التالي';setTimeout(next,700)}});$('start').onclick=start;$('replay').onclick=show;</script></html>

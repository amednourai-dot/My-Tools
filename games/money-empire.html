<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>إمبراطورية المال | Ahmed Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eff6ff;font-family:system-ui,Arial;padding:14px}.wrap{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back,button{border:1px solid #35435a;background:#202d42;color:#eff6ff;padding:10px 13px;border-radius:12px;font:inherit;text-decoration:none}h1{margin:14px 0 3px;font-size:25px}.muted{color:#a9b6c9;font-size:14px}.hero{background:linear-gradient(135deg,#174e3b,#1c3340);border-radius:20px;padding:20px;margin:15px 0;border:1px solid #2f705b}.cash{font-size:34px;font-weight:800;color:#8fffc1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.business{background:#1a2639;border:1px solid #2e3c54;border-radius:15px;padding:12px}.stat{text-align:center}.stat b{display:block;font-size:19px;color:#8fffc1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.business h3{margin:5px 0}.business p{font-size:13px;color:#a9b6c9;min-height:36px}.business button{width:100%;background:#16634b;border-color:#258d69}.business button:disabled{opacity:.45}.panel{background:#151f31;border:1px solid #2c3b52;border-radius:18px;padding:14px;margin:13px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}#message{color:#8fffc1;min-height:22px;margin-top:10px}.event{background:#202d42;border-radius:12px;padding:10px;margin-top:8px;font-size:13px}@media(max-width:380px){.grid{grid-template-columns:1fr}.cash{font-size:29px}}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← الألعاب</a><span class="muted">AHMED TOOLS</span></div><h1>💰 إمبراطورية المال</h1><div class="muted">ابنِ أعمالًا افتراضية، اجمع الأرباح، وأعد استثمار أموالك. لا توجد أموال حقيقية.</div><div class="hero"><div class="muted">رصيدك الحالي</div><div class="cash" id="cash">$1,000</div><div class="muted" id="day">اليوم 1</div></div><div class="stats"><div class="stat">دخل يومي<b id="income">$0</b></div><div class="stat">المشاريع<b id="count">0</b></div><div class="stat">صافي الثروة<b id="net">$1,000</b></div></div><div class="panel"><h3>🏗️ استثمر في مشروع</h3><div class="grid" id="businesses"></div></div><div class="panel"><h3>📅 إدارة المدينة</h3><div class="actions"><button id="dayBtn">مرور يوم وجمع الأرباح</button><button id="saveBtn">حفظ اللعبة</button><button id="resetBtn">إعادة من البداية</button></div><div id="message"></div><div class="event" id="log">ابدأ بشراء مشروعك الأول.</div></div></div>
<script>
const catalog=[{id:"cafe",name:"☕ مقهى صغير",cost:500,income:90,desc:"مشروع بسيط يدر دخلًا يوميًا."},{id:"shop",name:"🛒 متجر",cost:1200,income:220,desc:"متجر يبيع الاحتياجات اليومية."},{id:"farm",name:"🌾 مزرعة",cost:2500,income:460,desc:"إنتاج مستمر مع أرباح متوسطة."},{id:"tech",name:"💻 شركة تقنية",cost:6000,income:1200,desc:"استثمار مكلف بعائد قوي."},{id:"hotel",name:"🏨 فندق",cost:12000,income:2600,desc:"مشروع كبير لأصحاب الطموح."},{id:"factory",name:"🏭 مصنع",cost:25000,income:6000,desc:"أرباح مرتفعة وتكلفة عالية."}];let state={cash:1000,day:1,owned:{},events:0};
const $=id=>document.getElementById(id),money=n=>"$"+Math.floor(n).toLocaleString("en-US");
function render(){ $("cash").textContent=money(state.cash);$("day").textContent="اليوم "+state.day;$("income").textContent=money(totalIncome());$("count").textContent=Object.values(state.owned).reduce((a,b)=>a+b,0);$("net").textContent=money(state.cash+catalog.reduce((a,b)=>a+b.cost*(state.owned[b.id]||0),0));$("businesses").innerHTML=catalog.map(b=>'<div class="business"><h3>'+b.name+'</h3><p>'+b.desc+'<br>السعر: '+money(b.cost)+'<br>دخل الوحدة: '+money(b.income)+'/يوم<br>تملك: '+(state.owned[b.id]||0)+'</p><button data-buy="'+b.id+'" '+(state.cash<b.cost?'disabled':'')+'>شراء المشروع</button></div>').join("");document.querySelectorAll("[data-buy]").forEach(btn=>btn.onclick=()=>buy(btn.dataset.buy))}
function totalIncome(){return catalog.reduce((a,b)=>a+b.income*(state.owned[b.id]||0),0)}
function say(t){$("message").textContent=t}
function buy(id){let b=catalog.find(x=>x.id===id);if(state.cash<b.cost){say("رصيدك لا يكفي لهذا المشروع.");return}state.cash-=b.cost;state.owned[id]=(state.owned[id]||0)+1;say("تم شراء "+b.name+" بنجاح.");$("log").textContent="أصبحت تملك "+state.owned[id]+" من "+b.name+".";render();save(false)}
function nextDay(){let inc=totalIncome();state.cash+=inc;state.day++;state.events++;let extra="حصلت على دخل "+money(inc)+".";if(state.events%4===0&&inc>0){let bonus=Math.floor(inc*.5);state.cash+=bonus;extra+=" خبر جيد: مكافأة "+money(bonus)+" بسبب زيادة الطلب!"}else if(state.events%3===0&&inc>0){let fee=Math.min(state.cash,Math.floor(inc*.2));state.cash-=fee;extra+=" صيانة طارئة كلفتك "+money(fee)+"."}say("انتهى اليوم وجُمعت الأرباح.");$("log").textContent=extra;render();save(false)}
function save(show=true){localStorage.setItem("moneyEmpireSave",JSON.stringify(state));if(show)say("تم حفظ تقدمك على هذا الجهاز.")}
function load(){try{let s=JSON.parse(localStorage.getItem("moneyEmpireSave"));if(s&&typeof s.cash==="number")state=s}catch(e){}render()}
$("dayBtn").onclick=nextDay;$("saveBtn").onclick=()=>save(true);$("resetBtn").onclick=()=>{if(confirm("هل تريد حذف تقدمك والبدء من جديد؟")){state={cash:1000,day:1,owned:{},events:0};save(false);render();say("بدأت إمبراطوريتك من جديد.")}};load();
</script></body></html>

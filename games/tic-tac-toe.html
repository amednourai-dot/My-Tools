<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="لعبة إكس أو من Ahmed Tools. تحدّ الكمبيوتر بثلاثة مستويات أو العب مع صديقك.">
<title>لعبة إكس أو | Ahmed Tools</title>
<style>
:root{
    color-scheme:dark;
    --bg:#0f172a;
    --panel:#1e293b;
    --cell:#334155;
    --border:#475569;
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#2563eb;
    --primary-light:#93c5fd;
    --pink:#f472b6;
    --green:#22c55e;
    --danger:#ef4444;
    --radius:18px;
}
*{
    box-sizing:border-box;
}
html{
    min-height:100%;
    -webkit-tap-highlight-color:transparent;
}
body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    padding:16px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}
button,select{
    font:inherit;
}
button{
    cursor:pointer;
    touch-action:manipulation;
}
button:focus-visible,
select:focus-visible,
a:focus-visible{
    outline:3px solid var(--primary-light);
    outline-offset:3px;
}
button:disabled{
    cursor:not-allowed;
    opacity:.65;
}
.app{
    width:100%;
    max-width:440px;
    margin:auto;
}
.header{
    text-align:center;
    margin-bottom:18px;
}
.logo{
    width:56px;
    height:56px;
    margin:0 auto 10px;
    display:grid;
    place-items:center;
    border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    font-size:28px;
    font-weight:bold;
}
h1{
    font-size:28px;
    margin:0 0 8px;
}
.subtitle{
    color:var(--muted);
    font-size:13px;
    margin:0;
    line-height:1.7;
}
.panel{
    background:var(--panel);
    border:1px solid #334155;
    border-radius:var(--radius);
    padding:15px;
    margin-bottom:12px;
}
.section-title{
    font-size:14px;
    color:#cbd5e1;
    margin:0 0 11px;
    text-align:right;
}
.modes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
button{
    border:0;
    border-radius:12px;
    padding:12px 9px;
    font-weight:bold;
    font-size:14px;
    transition:background .15s,transform .15s,border-color .15s;
}
button:active:not(:disabled){
    transform:scale(.97);
}
.mode{
    background:var(--cell);
    color:#e2e8f0;
    border:1px solid transparent;
}
.mode.active{
    background:var(--primary);
    color:white;
}
.difficulty-wrap{
    margin-top:12px;
}
.label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:7px;
    text-align:right;
}
select{
    width:100%;
    padding:12px;
    background:#0f172a;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:11px;
}
.status{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:9px;
    margin-top:12px;
    border-radius:12px;
    background:#0f172a;
    color:var(--primary-light);
    font-weight:bold;
    font-size:15px;
    line-height:1.6;
}
.board{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    width:100%;
    max-width:330px;
    margin:15px auto;
}
.cell{
    aspect-ratio:1;
    min-width:0;
    padding:0;
    background:var(--cell);
    border:2px solid var(--border);
    border-radius:15px;
    color:white;
    font-size:clamp(38px,11vw,52px);
    font-weight:bold;
    display:grid;
    place-items:center;
    user-select:none;
    -webkit-user-select:none;
}
.cell.x{
    color:#60a5fa;
}
.cell.o{
    color:var(--pink);
}
.cell.winner{
    background:#14532d;
    border-color:var(--green);
    color:#bbf7d0;
    animation:winPulse .7s ease-in-out infinite alternate;
}
.cell:disabled{
    opacity:1;
}
@keyframes winPulse{
    from{box-shadow:0 0 0 rgba(34,197,94,0)}
    to{box-shadow:0 0 15px rgba(34,197,94,.25)}
}
.scores{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
}
.score{
    min-width:0;
    text-align:center;
    background:#0f172a;
    border:1px solid #263449;
    padding:11px 4px;
    border-radius:12px;
}
.score strong{
    display:block;
    font-size:24px;
    margin-bottom:6px;
}
.score span{
    display:block;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
}
.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
}
.primary{
    background:var(--primary);
    color:white;
}
.secondary{
    background:var(--cell);
    color:white;
    border:1px solid var(--border);
}
.danger{
    background:#7f1d1d;
    color:#fecaca;
}
.full{
    width:100%;
}
.tools-row{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
    margin-top:12px;
}
.small-btn{
    background:#0f172a;
    color:#cbd5e1;
    border:1px solid #334155;
    font-size:12px;
    padding:11px 5px;
}
.small-btn.active{
    border-color:var(--primary-light);
    color:var(--primary-light);
}
.stats-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}
.stats-heading h2{
    font-size:15px;
    margin:0;
}
.stats-heading span{
    color:var(--muted);
    font-size:11px;
}
.stats-extra{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}
.stat-box{
    background:#0f172a;
    padding:11px;
    border-radius:11px;
    text-align:center;
}
.stat-box span{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
}
.stat-box strong{
    font-size:18px;
}
.history-list{
    list-style:none;
    padding:0;
    margin:0;
    max-height:190px;
    overflow-y:auto;
}
.history-list li{
    padding:10px;
    margin-bottom:6px;
    background:#0f172a;
    border-radius:9px;
    color:#cbd5e1;
    font-size:12px;
    line-height:1.6;
}
.empty{
    color:var(--muted);
    text-align:center;
    font-size:12px;
    padding:12px;
}
.back{
    display:block;
    text-align:center;
    padding:12px;
    color:var(--primary-light);
    text-decoration:none;
    font-size:13px;
}
.footer{
    text-align:center;
    color:#64748b;
    font-size:11px;
    padding:4px 0 12px;
}
.toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    z-index:10;
    width:max-content;
    max-width:calc(100% - 32px);
    padding:12px 16px;
    border-radius:12px;
    background:#f8fafc;
    color:#0f172a;
    font-size:13px;
    text-align:center;
    box-shadow:0 8px 30px #0004;
    transition:.2s;
}
.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}
@media(max-height:780px){
    body{
        align-items:flex-start;
        padding-top:10px;
        padding-bottom:10px;
    }
    .header{
        margin-bottom:10px;
    }
    .logo{
        width:43px;
        height:43px;
        margin-bottom:7px;
        border-radius:14px;
        font-size:23px;
    }
    h1{
        font-size:24px;
    }
    .panel{
        padding:12px;
        margin-bottom:9px;
    }
    .board{
        max-width:290px;
        gap:6px;
        margin:10px auto;
    }
    .cell{
        border-radius:12px;
    }
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>
<body>
<main class="app">
<header class="header">
    <div class="logo" aria-hidden="true">❌⭕</div>
    <h1>لعبة إكس أو</h1>
    <p class="subtitle">تحدَّ الكمبيوتر أو نافس صديقك في Ahmed Tools</p>
</header>

<section class="panel" aria-label="لوحة اللعب">
    <div class="modes">
        <button type="button" class="mode active" id="cpuMode" aria-pressed="true">🤖 ضد الكمبيوتر</button>
        <button type="button" class="mode" id="friendMode" aria-pressed="false">👥 مع صديق</button>
    </div>

    <div class="difficulty-wrap" id="difficultyWrap">
        <label class="label" for="difficulty">مستوى صعوبة الكمبيوتر</label>
        <select id="difficulty">
            <option value="easy">🟢 سهل</option>
            <option value="medium">🟡 متوسط</option>
            <option value="hard" selected>🔴 صعب</option>
        </select>
    </div>

    <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true">دورك الآن: X</div>

    <div class="board" id="board" role="group" aria-label="لوحة إكس أو">
        <button type="button" class="cell" data-index="0" aria-label="الخانة 1"></button>
        <button type="button" class="cell" data-index="1" aria-label="الخانة 2"></button>
        <button type="button" class="cell" data-index="2" aria-label="الخانة 3"></button>
        <button type="button" class="cell" data-index="3" aria-label="الخانة 4"></button>
        <button type="button" class="cell" data-index="4" aria-label="الخانة 5"></button>
        <button type="button" class="cell" data-index="5" aria-label="الخانة 6"></button>
        <button type="button" class="cell" data-index="6" aria-label="الخانة 7"></button>
        <button type="button" class="cell" data-index="7" aria-label="الخانة 8"></button>
        <button type="button" class="cell" data-index="8" aria-label="الخانة 9"></button>
    </div>

    <div class="scores" aria-label="نتائج النمط الحالي">
        <div class="score">
            <strong id="xScore">0</strong>
            <span id="xLabel">انتصاراتك X</span>
        </div>
        <div class="score">
            <strong id="drawScore">0</strong>
            <span>التعادلات</span>
        </div>
        <div class="score">
            <strong id="oScore">0</strong>
            <span id="oLabel">انتصارات الكمبيوتر</span>
        </div>
    </div>

    <div class="tools-row">
        <button type="button" class="small-btn" id="undoBtn">↩️ تراجع</button>
        <button type="button" class="small-btn" id="soundBtn" aria-pressed="false">🔇 الصوت</button>
        <button type="button" class="small-btn" id="vibrationBtn" aria-pressed="false">📳 الاهتزاز</button>
    </div>
</section>

<div class="actions">
    <button type="button" class="primary" id="newGame">🔄 جولة جديدة</button>
    <button type="button" class="secondary" id="resetScore">🗑️ تصفير النتائج</button>
</div>

<section class="panel">
    <div class="stats-heading">
        <h2>📊 إحصائياتي</h2>
        <span id="modeStatsLabel">ضد الكمبيوتر</span>
    </div>
    <div class="stats-extra">
        <div class="stat-box">
            <span>إجمالي الجولات</span>
            <strong id="totalGames">0</strong>
        </div>
        <div class="stat-box">
            <span>نسبة الفوز</span>
            <strong id="winRate">0%</strong>
        </div>
    </div>
</section>

<section class="panel">
    <div class="stats-heading">
        <h2>📜 سجل الجولات</h2>
        <span id="historyCount">0 جولات</span>
    </div>
    <ul class="history-list" id="historyList" aria-label="سجل الجولات">
        <li class="empty">لم تلعب أي جولة بعد.</li>
    </ul>
    <button type="button" class="secondary full" id="clearHistory" style="margin-top:8px">مسح سجل الجولات</button>
</section>

<a class="back" href="index.html">→ العودة إلى عالم الألعاب</a>
<div class="footer">Ahmed Tools · لعبة إكس أو</div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const cells = [...document.querySelectorAll(".cell")];
const statusText = $("status");
const cpuMode = $("cpuMode");
const friendMode = $("friendMode");
const difficultySelect = $("difficulty");
const difficultyWrap = $("difficultyWrap");
const xScore = $("xScore");
const oScore = $("oScore");
const drawScore = $("drawScore");
const xLabel = $("xLabel");
const oLabel = $("oLabel");
const totalGames = $("totalGames");
const winRate = $("winRate");
const historyList = $("historyList");
const historyCount = $("historyCount");
const toastElement = $("toast");

const STORAGE_KEY = "ahmedTicTacToeV2";

const wins = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

const defaultData = {
    stats: {
        cpu: {x:0,o:0,draw:0},
        friend: {x:0,o:0,draw:0}
    },
    settings: {
        difficulty:"hard",
        sound:false,
        vibration:false
    },
    history:[]
};

let data = loadData();
let board = Array(9).fill("");
let mode = "cpu";
let turn = "X";
let ended = false;
let isThinking = false;
let computerTimer = null;
let toastTimer = null;
let roundMoves = [];
let undoStack = [];
let winningCells = [];
let audioContext = null;

difficultySelect.value = data.settings.difficulty;

function clone(value){
    return JSON.parse(JSON.stringify(value));
}

function validScore(value){
    return Number.isSafeInteger(value) && value >= 0;
}

function cleanStats(value){
    const result = {x:0,o:0,draw:0};

    if(!value || typeof value !== "object" || Array.isArray(value)){
        return result;
    }

    for(const key of ["x","o","draw"]){
        if(validScore(value[key])){
            result[key] = value[key];
        }
    }

    return result;
}

function loadData(){
    const result = clone(defaultData);

    try{
        const raw = localStorage.getItem(STORAGE_KEY);

        if(!raw) return result;

        const saved = JSON.parse(raw);

        if(!saved || typeof saved !== "object" || Array.isArray(saved)){
            return result;
        }

        if(saved.stats && typeof saved.stats === "object"){
            result.stats.cpu = cleanStats(saved.stats.cpu);
            result.stats.friend = cleanStats(saved.stats.friend);
        }

        if(saved.settings && typeof saved.settings === "object"){
            if(["easy","medium","hard"].includes(saved.settings.difficulty)){
                result.settings.difficulty = saved.settings.difficulty;
            }

            result.settings.sound = saved.settings.sound === true;
            result.settings.vibration = saved.settings.vibration === true;
        }

        if(Array.isArray(saved.history)){
            result.history = saved.history
                .filter(item =>
                    item &&
                    typeof item === "object" &&
                    ["cpu","friend"].includes(item.mode) &&
                    ["X","O","draw"].includes(item.result) &&
                    typeof item.date === "string"
                )
                .slice(0,20);
        }
    }catch(error){
        console.warn("تعذر تحميل البيانات المحفوظة.");
    }

    return result;
}

function saveData(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
        return true;
    }catch(error){
        showToast("تعذر حفظ البيانات على الجهاز.");
        return false;
    }
}

function showToast(message){
    toastElement.textContent = message;
    toastElement.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{
        toastElement.classList.remove("show");
    },2300);
}

function cancelComputerMove(){
    if(computerTimer !== null){
        clearTimeout(computerTimer);
        computerTimer = null;
    }

    isThinking = false;
}

function winner(b = board){
    for(const line of wins){
        const [a,c,d] = line;

        if(b[a] && b[a] === b[c] && b[a] === b[d]){
            return {result:b[a],line};
        }
    }

    if(b.every(Boolean)){
        return {result:"draw",line:[]};
    }

    return null;
}

function render(){
    const result = winner(board);

    winningCells = result && result.result !== "draw"
        ? result.line
        : [];

    cells.forEach((cell,i)=>{
        const value = board[i];

        cell.textContent = value;
        cell.className = "cell";

        if(value){
            cell.classList.add(value.toLowerCase());
        }

        if(winningCells.includes(i)){
            cell.classList.add("winner");
        }

        const name = value === "X"
            ? "X، الخانة " + (i+1)
            : value === "O"
                ? "O، الخانة " + (i+1)
                : "الخانة " + (i+1) + "، فارغة";

        cell.setAttribute("aria-label",name);

        cell.disabled =
            ended ||
            isThinking ||
            Boolean(value) ||
            (mode === "cpu" && turn !== "X");
    });

    $("undoBtn").disabled = undoStack.length === 0 || isThinking;

    updateScoreDisplay();
}

function updateScoreDisplay(){
    const scores = data.stats[mode];

    xScore.textContent = scores.x;
    oScore.textContent = scores.o;
    drawScore.textContent = scores.draw;

    if(mode === "cpu"){
        xLabel.textContent = "انتصاراتك X";
        oLabel.textContent = "انتصارات الكمبيوتر";
        $("modeStatsLabel").textContent = "ضد الكمبيوتر";
    }else{
        xLabel.textContent = "انتصارات اللاعب X";
        oLabel.textContent = "انتصارات اللاعب O";
        $("modeStatsLabel").textContent = "مع صديق";
    }

    const games = scores.x + scores.o + scores.draw;
    totalGames.textContent = games;

    const playerWins = mode === "cpu" ? scores.x : scores.x;
    winRate.textContent = games
        ? Math.round(playerWins / games * 100) + "%"
        : "0%";

    historyCount.textContent = data.history.length + " جولات";

    renderHistory();
}

function renderHistory(){
    historyList.replaceChildren();

    if(data.history.length === 0){
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "لم تلعب أي جولة بعد.";
        historyList.appendChild(li);
        return;
    }

    for(const item of data.history){
        const li = document.createElement("li");
        const date = new Date(item.date);

        const resultText = item.result === "draw"
            ? "تعادل"
            : item.result === "X"
                ? "فاز X"
                : "فاز O";

        const modeText = item.mode === "cpu"
            ? "ضد الكمبيوتر"
            : "مع صديق";

        const dateText = Number.isNaN(date.getTime())
            ? ""
            : date.toLocaleString("ar");

        li.textContent =
            modeText + " · " + resultText +
            " · " + item.moves + " حركات" +
            (dateText ? " · " + dateText : "");

        historyList.appendChild(li);
    }
}

function setStatus(message){
    statusText.textContent = message;
}

function playSound(type){
    if(!data.settings.sound) return;

    try{
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if(!AudioContextClass) return;

        if(!audioContext){
            audioContext = new AudioContextClass();
        }

        if(audioContext.state === "suspended"){
            audioContext.resume().catch(()=>{});
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        const frequencies = {
            move:440,
            win:720,
            draw:300,
            undo:380
        };

        oscillator.frequency.value = frequencies[type] || 440;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(.0001,audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .09,
            audioContext.currentTime + .015
        );
        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + .16
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + .17);
    }catch(error){
        console.warn("تعذر تشغيل الصوت.");
    }
}

function vibrate(pattern = 40){
    if(!data.settings.vibration) return;

    try{
        if("vibrate" in navigator){
            navigator.vibrate(pattern);
        }
    }catch(error){}
}

function setSettingsButtons(){
    $("soundBtn").textContent =
        data.settings.sound ? "🔊 الصوت" : "🔇 الصوت";

    $("vibrationBtn").textContent =
        data.settings.vibration ? "📳 الاهتزاز ON" : "📳 الاهتزاز";

    $("soundBtn").classList.toggle("active",data.settings.sound);
    $("vibrationBtn").classList.toggle("active",data.settings.vibration);

    $("soundBtn").setAttribute("aria-pressed",String(data.settings.sound));
    $("vibrationBtn").setAttribute("aria-pressed",String(data.settings.vibration));
}

function minimax(b,player,depth = 0){
    const result = winner(b);

    if(result){
        if(result.result === "O"){
            return {score:10-depth};
        }

        if(result.result === "X"){
            return {score:depth-10};
        }

        return {score:0};
    }

    const moves = [];

    for(let i=0;i<9;i++){
        if(b[i] !== "") continue;

        b[i] = player;

        const score = minimax(
            b,
            player === "O" ? "X" : "O",
            depth+1
        ).score;

        b[i] = "";

        moves.push({index:i,score});
    }

    if(player === "O"){
        return moves.reduce(
            (best,move)=>move.score > best.score ? move : best,
            moves[0]
        );
    }

    return moves.reduce(
        (best,move)=>move.score < best.score ? move : best,
        moves[0]
    );
}

function findImmediateMove(b,player){
    for(let i=0;i<9;i++){
        if(b[i]) continue;

        b[i] = player;
        const result = winner(b);
        b[i] = "";

        if(result && result.result === player){
            return i;
        }
    }

    return -1;
}

function chooseComputerMove(){
    const available = board
        .map((value,index)=>value ? -1 : index)
        .filter(index=>index !== -1);

    if(!available.length) return -1;

    const difficulty = data.settings.difficulty;

    if(difficulty === "easy"){
        return available[Math.floor(Math.random()*available.length)];
    }

    if(difficulty === "medium"){
        const winMove = findImmediateMove(board,"O");

        if(winMove !== -1) return winMove;

        const blockMove = findImmediateMove(board,"X");

        if(blockMove !== -1) return blockMove;

        if(!board[4] && Math.random() < .65){
            return 4;
        }

        const preferred = available.filter(i=>[0,2,6,8].includes(i));

        if(preferred.length && Math.random() < .7){
            return preferred[Math.floor(Math.random()*preferred.length)];
        }

        return available[Math.floor(Math.random()*available.length)];
    }

    return minimax([...board],"O").index;
}

function snapshot(){
    return {
        board:[...board],
        turn,
        ended,
        moves:[...roundMoves]
    };
}

function restoreSnapshot(state){
    board = [...state.board];
    turn = state.turn;
    ended = state.ended;
    roundMoves = [...state.moves];
}

function rememberState(){
    undoStack.push(snapshot());

    if(undoStack.length > 20){
        undoStack.shift();
    }
}

function play(index){
    if(
        ended ||
        isThinking ||
        board[index] ||
        (mode === "cpu" && turn !== "X")
    ){
        return;
    }

    rememberState();

    board[index] = turn;

    roundMoves.push({
        player:turn,
        index
    });

    playSound("move");
    vibrate(25);

    const result = winner(board);

    if(result){
        finish(result);
        return;
    }

    turn = turn === "X" ? "O" : "X";

    if(mode === "cpu"){
        isThinking = true;
        setStatus("🤖 الكمبيوتر يفكر...");
        render();

        computerTimer = setTimeout(()=>{
            computerTimer = null;
            computerMove();
        },300);
    }else{
        setStatus(turn === "X" ? "دور اللاعب X" : "دور اللاعب O");
        render();
    }
}

function computerMove(){
    if(ended || mode !== "cpu" || turn !== "O"){
        isThinking = false;
        render();
        return;
    }

    const index = chooseComputerMove();

    if(index < 0){
        isThinking = false;
        const result = winner(board);

        if(result){
            finish(result);
        }else{
            setStatus("تعذر اختيار حركة. ابدأ جولة جديدة.");
            render();
        }

        return;
    }

    rememberState();

    board[index] = "O";

    roundMoves.push({
        player:"O",
        index
    });

    isThinking = false;

    playSound("move");
    vibrate(25);

    const result = winner(board);

    if(result){
        finish(result);
        return;
    }

    turn = "X";
    setStatus("دورك الآن: X");
    render();
}

function finish(result){
    cancelComputerMove();

    ended = true;

    const scores = data.stats[mode];

    if(result.result === "draw"){
        scores.draw++;
        setStatus("🤝 تعادل! أحسنتم.");
        playSound("draw");
        vibrate([40,40,40]);
    }else{
        scores[result.result.toLowerCase()]++;

        if(mode === "cpu"){
            setStatus(
                result.result === "X"
                    ? "🎉 فزت! أحسنت."
                    : "🤖 فاز الكمبيوتر! حاول مجددًا."
            );
        }else{
            setStatus(
                result.result === "X"
                    ? "🏆 فاز اللاعب X!"
                    : "🏆 فاز اللاعب O!"
            );
        }

        playSound("win");
        vibrate([80,50,120]);
    }

    data.history.unshift({
        mode,
        result:result.result,
        moves:roundMoves.length,
        date:new Date().toISOString()
    });

    data.history = data.history.slice(0,20);

    saveData();
    render();
}

function newGame(){
    cancelComputerMove();

    board = Array(9).fill("");
    turn = "X";
    ended = false;
    roundMoves = [];
    undoStack = [];

    setStatus(mode === "cpu" ? "دورك الآن: X" : "دور اللاعب X");

    render();
}

function setMode(next){
    cancelComputerMove();

    mode = next;

    cpuMode.classList.toggle("active",mode === "cpu");
    friendMode.classList.toggle("active",mode === "friend");

    cpuMode.setAttribute("aria-pressed",String(mode === "cpu"));
    friendMode.setAttribute("aria-pressed",String(mode === "friend"));

    difficultyWrap.hidden = mode !== "cpu";

    newGame();
    updateScoreDisplay();
}

function undoMove(){
    if(isThinking || ended || undoStack.length === 0){
        if(ended){
            showToast("ابدأ جولة جديدة قبل التراجع.");
        }

        return;
    }

    if(mode === "cpu"){
        const lastMove = roundMoves[roundMoves.length-1];

        if(lastMove && lastMove.player === "O"){
            if(undoStack.length >= 2){
                undoStack.pop();
            }

            const state = undoStack.pop();

            if(state){
                restoreSnapshot(state);
            }
        }else{
            const state = undoStack.pop();

            if(state){
                restoreSnapshot(state);
            }
        }
    }else{
        const state = undoStack.pop();

        if(state){
            restoreSnapshot(state);
        }
    }

    setStatus(
        mode === "cpu"
            ? "دورك الآن: X"
            : turn === "X"
                ? "دور اللاعب X"
                : "دور اللاعب O"
    );

    playSound("undo");
    vibrate(25);
    render();
}

function resetScores(){
    if(!confirm("هل تريد تصفير جميع النتائج في النمطين؟")){
        return;
    }

    data.stats = {
        cpu:{x:0,o:0,draw:0},
        friend:{x:0,o:0,draw:0}
    };

    data.history = [];

    saveData();
    newGame();
    updateScoreDisplay();

    showToast("تم تصفير النتائج والسجل.");
}

cells.forEach((cell,index)=>{
    cell.addEventListener("click",()=>play(index));
});

cpuMode.addEventListener("click",()=>setMode("cpu"));
friendMode.addEventListener("click",()=>setMode("friend"));

difficultySelect.addEventListener("change",()=>{
    const value = difficultySelect.value;

    if(!["easy","medium","hard"].includes(value)){
        difficultySelect.value = data.settings.difficulty;
        return;
    }

    data.settings.difficulty = value;
    saveData();

    const names = {
        easy:"السهل",
        medium:"المتوسط",
        hard:"الصعب"
    };

    showToast("مستوى الكمبيوتر: " + names[value]);

    if(mode === "cpu"){
        newGame();
    }
});

$("newGame").addEventListener("click",newGame);
$("resetScore").addEventListener("click",resetScores);

$("undoBtn").addEventListener("click",undoMove);

$("soundBtn").addEventListener("click",()=>{
    data.settings.sound = !data.settings.sound;

    saveData();
    setSettingsButtons();

    if(data.settings.sound){
        playSound("move");
    }

    showToast(data.settings.sound ? "تم تشغيل الصوت." : "تم إيقاف الصوت.");
});

$("vibrationBtn").addEventListener("click",()=>{
    if(!("vibrate" in navigator)){
        showToast("الاهتزاز غير مدعوم في هذا المتصفح.");
        return;
    }

    data.settings.vibration = !data.settings.vibration;

    saveData();
    setSettingsButtons();

    if(data.settings.vibration){
        vibrate(40);
    }

    showToast(
        data.settings.vibration
            ? "تم تفعيل الاهتزاز."
            : "تم إيقاف الاهتزاز."
    );
});

$("clearHistory").addEventListener("click",()=>{
    if(!data.history.length){
        showToast("السجل فارغ بالفعل.");
        return;
    }

    if(!confirm("هل تريد مسح سجل الجولات؟")){
        return;
    }

    data.history = [];
    saveData();
    updateScoreDisplay();

    showToast("تم مسح سجل الجولات.");
});

difficultyWrap.hidden = mode !== "cpu";

setSettingsButtons();
saveData();
newGame();
</script>
</body>
</html>

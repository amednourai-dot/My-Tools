<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#190d18">
<title>الهروب من القنبلة | Ahmed Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:13px;background:#160d19;color:#fff0f5;font-family:system-ui,Arial,sans-serif}.wrap{max-width:540px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back,button{border:1px solid #573049;border-radius:12px;background:#2b1830;color:#fff0f5;padding:10px 13px;font:inherit;text-decoration:none}h1{font-size:24px;margin:14px 0 4px}.muted{color:#c4a9bd;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat{background:#28162b;border:1px solid #4b2a4d;border-radius:13px;text-align:center;padding:9px}.stat b{display:block;color:#ffcc70;font-size:20px}.panel{background:#211328;border:1px solid #4b2a4d;border-radius:18px;padding:12px}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:390px;margin:auto;direction:ltr}.cell{aspect-ratio:1;border-radius:8px;background:#39203d;border:1px solid #57375c;display:grid;place-items:center;font-size:20px;user-select:none}.wall{background:#120b18;border-color:#26142c}.player{background:#236c9b;border-color:#56c7ff}.key{background:#68501c;color:#ffe9a4}.exit{background:#17613d;color:#b8ffd1}.bomb{background:#7b2339;color:#ffd0da}.controls{display:grid;grid-template-columns:repeat(3,58px);gap:7px;justify-content:center;margin:14px auto 4px}.controls button{font-size:22px;padding:12px}.blank{visibility:hidden}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.primary{background:#a52c52;border-color:#e45a7e}#message{text-align:center;color:#ffcf7c;min-height:24px;margin:11px 0 0}.hint{text-align:center;color:#c4a9bd;font-size:12px;margin-top:8px}@media(max-width:370px){body{padding:8px}.board{gap:3px}.cell{font-size:16px;border-radius:6px}}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← الألعاب</a><span class="muted">AHMED TOOLS</span></div><h1>💣 الهروب من القنبلة</h1><div class="muted">اجمع المفتاح ثم اهرب إلى المخرج قبل أن تنفجر القنابل. تجنب الخانات الحمراء.</div><div class="stats"><div class="stat">المستوى<b id="level">1</b></div><div class="stat">الوقت<b id="time">30</b></div><div class="stat">المحاولات<b id="tries">0</b></div></div><div class="panel"><div class="board" id="board"></div><div class="controls"><button class="blank"> </button><button data-move="up">⬆️</button><button class="blank"> </button><button data-move="left">⬅️</button><button data-move="down">⬇️</button><button data-move="right">➡️</button></div><div class="actions"><button id="restart">إعادة المرحلة</button><button id="next" class="primary">المرحلة التالية</button></div><div id="message">أنت 🧍 — المفتاح 🔑 — المخرج 🚪</div><div class="hint">استخدم الأسهم على الشاشة أو أزرار الاتجاهات في لوحة المفاتيح.</div></div></div>
<script>
const $=id=>document.getElementById(id);
const maps=[
["#######","#P....#","#.##..#","#..B#K#","#.#...#","#....E#","#######"],
["#######","#P#...#","#.#B#.#","#...#K#","#B#...#","#....E#","#######"],
["#######","#P....#","#.##B.#","#K.....#","#.#.##.#","#....E#","#######"]];
let level=0,grid=[],px=1,py=1,key=false,tries=0,time=30,timer=null,ended=false;
function setup(){clearInterval(timer);grid=maps[level%maps.length].map(r=>r.split(""));px=1;py=1;key=false;time=30;ended=false;$("level").textContent=level+1;$("time").textContent=time;$("tries").textContent=tries;$("message").textContent="اجمع المفتاح ثم اهرب إلى المخرج.";render();timer=setInterval(()=>{if(ended)return;time--;$("time").textContent=time;if(time<=0)lose("انتهى الوقت! حاول مرة أخرى.")},1000)}
function render(){let b=$("board");b.innerHTML="";grid.forEach((row,y)=>row.forEach((v,x)=>{let c=document.createElement("div");c.className="cell";if(v==="#")c.classList.add("wall");if(v==="B")c.classList.add("bomb");if(v==="K")c.classList.add("key");if(v==="E")c.classList.add("exit");if(x===px&&y===py){c.className="cell player";c.textContent="🧍"}else c.textContent=v==="#"?"":v==="B"?"💣":v==="K"?"🔑":v==="E"?"🚪":"";b.appendChild(c)}))}
function lose(msg){ended=true;clearInterval(timer);tries++;$("tries").textContent=tries;$("message").textContent=msg}
function move(dir){if(ended)return;let dx=dir==="left"?-1:dir==="right"?1:0,dy=dir==="up"?-1:dir==="down"?1:0,nx=px+dx,ny=py+dy;if(!grid[ny]||grid[ny][nx]==="#"||grid[ny][nx]===undefined)return;let v=grid[ny][nx];if(v==="B"){render();lose("💥 انفجرت القنبلة! أعد المحاولة.");return}if(v==="K"){key=true;grid[ny][nx]=".";$("message").textContent="أخذت المفتاح! اتجه إلى المخرج 🚪"}if(v==="E"){if(!key){$("message").textContent="المخرج مغلق. اجمع المفتاح أولًا.";return}px=nx;py=ny;ended=true;clearInterval(timer);$("message").textContent="نجحت في الهروب! 🎉";render();return}px=nx;py=ny;render()}
document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>move(b.dataset.move));document.addEventListener("keydown",e=>{let m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){e.preventDefault();move(m[e.key])}});$("restart").onclick=setup;$("next").onclick=()=>{if(ended&&key&&time>0){level++;setup()}else $("message").textContent="أكمل المرحلة الحالية أولًا."};setup();
</script></body></html>
